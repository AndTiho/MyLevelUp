services:
  web:
    build: .
    container_name: mylevelup_web
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/mylevelup
      - static_volume:/mylevelup/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env

  db:
    image: postgres:16
    container_name: mylevelup_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: mylevelup_redis
    ports:
      - "6379:6379"

  celery:
    build: .
    container_name: mylevelup_celery
    command: celery -A config worker -l info
    volumes:
      - .:/mylevelup
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build: .
    container_name: mylevelup_celery_beat
    command: celery -A config beat -l info
    volumes:
      - .:/mylevelup
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  static_volume:
  celerybeat_data:
